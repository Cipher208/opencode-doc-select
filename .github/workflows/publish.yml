name: publish

# Публикация в npm выполняется на стороне GitHub: токен живёт в репозиторных
# секретах и никогда не появляется ни на одной машине разработчика.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: install dependencies
        run: npm install --no-audit --no-fund

      - name: guard — the tag must match package.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG version=$VERSION"
          [ "$TAG" = "v$VERSION" ] || { echo "tag and package.json disagree"; exit 1; }

      - name: tests
        run: bun test

      - name: typecheck
        run: bun run typecheck

      - name: publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
