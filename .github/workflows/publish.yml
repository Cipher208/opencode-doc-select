name: publish

# Публикация через OIDC (trusted publishing): токена нет вообще, npm выдаёт
# GitHub Actions короткоживущие учётные данные по идентичности workflow.
#
# Требуется на npmjs.com: Package settings -> Trusted Publisher ->
#   Organization or user : Cipher208
#   Repository           : opencode-doc-select
#   Workflow filename    : publish.yml
#   Allowed actions      : allow npm publish
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # OIDC-аутентификация требует свежего npm; берём версию из реестра, а не
      # ту, что случайно оказалась в образе раннера.
      - name: npm at a version that supports OIDC
        run: npm install -g npm@latest && npm --version

      - name: install dependencies
        run: npm install --no-audit --no-fund

      - name: guard - the tag must match package.json
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG version=$VERSION"
          [ "$TAG" = "v$VERSION" ] || { echo "tag and package.json disagree"; exit 1; }

      - name: tests
        run: bun test

      - name: typecheck
        run: bun run typecheck

      - name: publish
        run: npm publish --access public --provenance
