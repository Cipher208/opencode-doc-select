name: publish

# Публикация через OIDC (trusted publishing): токена нет вообще, npm выдаёт
# GitHub Actions короткоживущие учётные данные по идентичности workflow.
#
# Требуется на npmjs.com: Package settings -> Trusted Publisher ->
#   Organization or user : Cipher208
#   Repository           : opencode-doc-select
#   Workflow filename    : publish.yml
#   Allowed actions      : allow npm publish
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for OIDC

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # OIDC-аутентификация требует свежего npm; берём версию из реестра, а не
      # ту, что случайно оказалась в образе раннера.
      - name: npm at a version that supports OIDC
        run: npm install -g npm@latest && npm --version

      - name: install dependencies
        # bun.lock is the committed lockfile; npm install would resolve versions
        # afresh and could publish a dependency set nobody tested.
        run: bun install --frozen-lockfile

      - name: guard - the tag must match package.json
        run: |
          REF="${GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./package.json').version")"
          echo "ref=$REF version=$VERSION"
          if [ "${REF#v}" != "$REF" ]; then
            # вызвано релизом: тег обязан совпадать с версией
            [ "$REF" = "v$VERSION" ] || { echo "tag $REF disagrees with package.json $VERSION"; exit 1; }
          else
            # ручной запуск из ветки: тега нет, версию публикуем как есть
            echo "manual dispatch from '$REF' - publishing $VERSION without a tag"
          fi

      - name: tests
        run: bun test

      - name: typecheck
        run: bun run typecheck

      - name: publish
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "auth: token from repository secrets (temporary, for the first publish)"
          else
            echo "auth: OIDC trusted publisher"
          fi
          npm publish --access public --provenance
        env:
          # Необязателен. Нужен только для самой первой публикации, пока на npmjs.com
          # не настроен Trusted Publisher; после настройки секрет удаляется и npm
          # авторизуется сам. Пустое значение не мешает OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
